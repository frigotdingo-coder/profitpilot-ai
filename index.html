
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProfitPilot AI</title>
<style>
:root{
 --forest:#173D2D;--green:#2F6847;--olive:#91A77A;
 --bg:#F3F5F0;--white:#fff;--ink:#26352D;
 --muted:#829087;--line:#E5EAE3;--beige:#E8E5D8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}
.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:var(--forest);color:#fff;padding:24px 17px;display:flex;flex-direction:column;z-index:10}
.logo{font-size:21px;font-weight:700;letter-spacing:-.5px;padding:8px 8px 26px}
.logo span{color:#A8C6A5}
.navlabel{font-size:10px;letter-spacing:1.8px;color:#91A99B;padding:10px 12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#C6D2C9;text-align:left;padding:12px;border-radius:10px;margin:3px 0;font-size:14px;transition:.2s}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex-shrink:0}
.nav:hover{background:#254B39;color:white}
.nav.active{background:#315943;color:white}
.sidebottom{margin-top:auto;border-top:1px solid #355744;padding:17px 8px;color:#B3C4B7;font-size:12px;line-height:1.7}
.sidebottom strong{color:white}
main{margin-left:248px;min-height:100vh;padding:0 36px 40px}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:26px}
.topname{font-size:14px;font-weight:600}
.topright{display:flex;align-items:center;gap:16px}
.topbtn{border:1px solid var(--line);background:white;border-radius:10px;width:38px;height:38px;color:var(--ink)}
.profile{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;background:#D8E4D5;display:flex;align-items:center;justify-content:center;color:var(--forest);font-weight:bold}
.page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:27px;letter-spacing:-.8px;margin:0 0 8px;font-weight:600}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.hero{position:relative;height:310px;border-radius:19px;overflow:hidden;background:#355744;margin-bottom:23px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,37,25,.76),rgba(14,37,25,.1))}
.hero-content{position:absolute;z-index:2;top:40px;left:35px;right:30px;color:white;max-width:600px}
.hero-tag{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#D5E2D5}
.hero h2{font-size:34px;line-height:1.15;margin:15px 0 12px;font-weight:600;letter-spacing:-1px}
.hero p{font-size:14px;color:#E1E9E0;line-height:1.6;max-width:440px}
.btn{border:0;border-radius:9px;padding:11px 15px;background:#DCE8D7;color:var(--forest);font-size:13px;font-weight:600}
.btn:hover{background:white}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:22px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}
.kpi{transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,61,45,.07)}
.klabel{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kvalue{font-size:23px;font-weight:600;letter-spacing:-.5px;margin:13px 0 8px}
.kfoot{font-size:11px;color:var(--green)}
.kfoot.neutral{color:var(--muted)}
.sectiongrid{display:grid;grid-template-columns:1.65fr 1fr;gap:17px;margin-bottom:18px}
.cardtitle{font-size:15px;font-weight:600;margin-bottom:5px}
.carddesc{font-size:12px;color:var(--muted)}
.chartbox{height:230px;margin-top:18px}
canvas{width:100%;height:230px;display:block}
.insight{background:var(--forest);color:white;border-radius:15px;padding:23px;position:relative;overflow:hidden}
.insight .eyebrow{font-size:10px;color:#B7D0B8;letter-spacing:1.5px}
.insight h3{font-size:18px;line-height:1.4;margin:15px 0}
.insight p{font-size:13px;line-height:1.7;color:#D3DFD4}
.insight .tag{display:inline-block;background:#355943;border-radius:20px;padding:7px 10px;font-size:11px;color:#C8DEC9;margin-top:8px}
.lowergrid{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}
.photoitem{display:flex;gap:14px;align-items:center;margin-top:17px}
.photoitem img{width:78px;height:62px;object-fit:cover;border-radius:10px}
.photoitem strong{font-size:13px}
.photoitem p{font-size:12px;color:var(--muted);margin:6px 0 0}
table{border-collapse:collapse;width:100%;margin-top:16px;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;padding:12px 8px;border-bottom:1px solid var(--line)}
td{padding:14px 8px;border-bottom:1px solid var(--line)}
.status{color:var(--green);font-size:11px;background:#EDF4EC;padding:6px 9px;border-radius:20px;display:inline-block}
.smallphoto{height:170px;border-radius:12px;overflow:hidden;margin:15px 0}
.smallphoto img{width:100%;height:100%;object-fit:cover}
.empty{color:var(--muted);font-size:13px}
.mobiletoggle{display:none}
@media(max-width:1200px){
 main{padding:0 22px 30px}
 .kpis{grid-template-columns:repeat(3,1fr)}
 .sectiongrid,.lowergrid{grid-template-columns:1fr}
}
@media(max-width:760px){
 .sidebar{position:relative;width:100%;height:auto;padding:13px}
 .logo{padding:6px 8px 13px}
 .navlabel,.sidebottom{display:none}
 #nav{display:flex;overflow:auto;gap:5px}
 .nav{width:auto;min-width:max-content;margin:0;padding:10px;font-size:12px}
 .nav svg{width:16px}
 main{margin:0;padding:0 14px 25px}
 .topbar{height:60px;margin-bottom:18px}
 .hero{height:270px}
 .hero-content{left:20px;top:25px}
 .hero h2{font-size:27px}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .kvalue{font-size:21px}
 .sectiongrid,.lowergrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="sidebar">
<div class="logo">ProfitPilot <span>AI</span></div>
<div class="navlabel">УПРАВЛЕНИЕ</div>
<nav id="nav">
<button class="nav active" data-page="home">
<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9v12h14V9M9 21v-7h6v7"/></svg>Главная

</button>
<button class="nav" data-page="livestock">
<svg viewBox="0 0 24 24"><path d="M4 9 2 6m18 3 2-3M5 9h14v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM8 9V5h8v4M8 14h.01M16 14h.01"/></svg>Животноводство
</button>
<button class="nav" data-page="finance">
<svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 4 3 5-7"/></svg>Финансы
</button>
<button class="nav" data-page="ai">
<svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>AI-аналитика

return `<div class="page"><h1>Растениеводство</h1><div class="subtitle">Земельный фонд, культуры и производственные показатели</div>

function reports(){
return `<div class="page"><h1>Отчёты</h1><div class="subtitle">Аналитические сводки предприятия</div>

function data(){
return `<div class="page"><h1>Данные предприятия</h1><div class="subtitle">Центр данных ProfitPilot AI</div>

function settings(){
return `<div class="page"><h1>Настройки</h1><div class="subtitle">Профиль и параметры интерфейса</div>
<div class="card"><div class="cardtitle">Профиль пользователя</div><p>Арина Я.</p><p class="empty">ProfitPilot AI · Система аналитики агробизнеса</p></div>
<div class="card" style="margin-top:18px"><div class="cardtitle">Интерфейс</div><p>Язык: Русский</p><p>Тема: Светлая рабочая область / тёмно-зелёная навигация</p></div></div>`;
}

const pages={home,crops,livestock,finance,ai,simulator,reports,data,settings};
const titles={home:'Обзор предприятия',crops:'Растениеводство',livestock:'Животноводство',finance:'Финансы',ai:'AI-аналитика',simulator:'Симулятор',reports:'Отчёты',data:'Данные предприятия',settings:'Настройки'};

function draw(){
const c=document.getElementById('financechart');
if(!c)return;
const ctx=c.getContext('2d');
const w=c.clientWidth,h=230,d=window.devicePixelRatio||1;
if(!w)return;
c.width=w*d;c.height=h*d;ctx.scale(d,d);
ctx.strokeStyle='#EDF0EB';ctx.lineWidth=1;
for(let i=0;i<5;i++){let y=20+i*42;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
const a=[45,70,58,90,80,115,100,145,130,175,160,205];
function line(arr,color){
ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.5;
arr.forEach((v,i)=>{let x=i*w/(arr.length-1),y=h-v-10;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
ctx.stroke();
}
line(a,'#2F6847');line(a.map(v=>v*.62),'#91A77A');
}

function show(key){
if(!pages[key])return;
document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===key));
topname.textContent=titles[key]||'ProfitPilot AI';
content.innerHTML=pages[key]();
if(document.getElementById('financechart'))draw();
window.scrollTo(0,0);
}

nav.addEventListener('click',e=>{
const b=e.target.closest('[data-page]');
if(b)show(b.dataset.page);
});
document.addEventListener('click',e=>{
const b=e.target.closest('[data-page]');
if(b&&!nav.contains(b))show(b.dataset.page);
});
window.addEventListener('resize',draw);
show('home');
</script>
</body>
